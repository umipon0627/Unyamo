<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 背景: ディープグリーン全面 (maskable 安全域 80% 内にロゴを収める設計) -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1e6b4d"/>

  <!-- クリーム色の角丸カード (中央, 80% 安全域に収まる) -->
  <rect x="160" y="200" width="704" height="624" rx="96" ry="96" fill="#fbf6ec"/>

  <!-- ゴールドの帯 (カード上部のアクセント) -->
  <rect x="160" y="200" width="704" height="56" rx="28" ry="28" fill="#e5b649"/>

  <!-- メインテキスト "Unyam" -->
  <text x="512" y="540"
        text-anchor="middle"
        font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif"
        font-weight="800"
        font-size="184"
        fill="#1e6b4d"
        letter-spacing="-2">Unyam</text>

  <!-- サブテキスト "ウニャム" -->
  <text x="512" y="660"
        text-anchor="middle"
        font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Hiragino Sans', sans-serif"
        font-weight="700"
        font-size="64"
        fill="#c99634"
        letter-spacing="10">ウニャム</text>

  <!-- 下部装飾: スートマーク 3つ (♠♦♣ 風) -->
  <g fill="#1e6b4d" opacity="0.75">
    <circle cx="450" cy="760" r="11"/>
    <rect x="501" y="749" width="22" height="22" transform="rotate(45 512 760)"/>
    <circle cx="574" cy="760" r="11"/>
  </g>
</svg>
